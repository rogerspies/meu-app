# 1. A Identidade da Aplicação
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meu-app-sa
  namespace: default

---
# 2. A Role (O que o app pode fazer)
# Vamos dar permissão apenas para ele ver os próprios detalhes
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: meu-app-minimal-role
rules:
- apiGroups: [""]
  resources: ["pods", "configmaps"]
  verbs: ["get", "list"]

---
# 3. O Elo (Liga a Identidade à Permissão)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meu-app-sa-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: meu-app-sa
  namespace: default
roleRef:
  kind: Role
  name: meu-app-minimal-role
  apiGroup: rbac.authorization.k8s.io