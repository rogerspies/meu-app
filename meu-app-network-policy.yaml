apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meu-app-deny-internal
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: meu-app # Alvo desta política
  policyTypes:
  - Ingress
  ingress:
  # REGRA 1: Permitir tráfego externo (Internet)
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8   # BLOQUEIA IPs internos da rede do GCP
        - 172.16.0.0/12 # BLOQUEIA IPs internos do Docker/K8s
        - 192.168.0.0/16 # BLOQUEIA IPs internos comuns
    ports:
    - protocol: TCP
      port: 80
  
  # REGRA 2: Permitir tráfego de outros pods autorizados (se houver)
  # Se você não adicionar nada aqui, nenhum outro POD do cluster fala com o meu-app